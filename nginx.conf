server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript text/plain;
  add_header X-Robots-Tag "noindex, nofollow" always;
  location /photos/ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "public, max-age=86400";
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
